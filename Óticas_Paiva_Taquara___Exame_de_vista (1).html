:root{--display:'Archivo','Helvetica Neue',Arial,sans-serif;--font:'Figtree','Segoe UI',Helvetica,Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#F3F5F9;color:#0B1A3A}
body{font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15;font-family:var(--display)}
:focus-visible{outline:3px solid #FF7A2F;outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.brand{display:flex;align-items:baseline;gap:7px;font-family:var(--display);font-weight:800;font-stretch:118%;letter-spacing:.02em;font-size:22px;line-height:1;text-transform:uppercase}
.brand b{color:#FF7A2F;font-weight:800}
@keyframes fade{from{opacity:0}}


/* ---- slides de promoção ---- */
.lp-ast{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:700}
.lp-big{font-family:var(--display);font-weight:800;font-stretch:118%;line-height:.86;letter-spacing:-.02em}
.lp-por{display:flex;align-items:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.lp-por small{font-weight:800;font-size:clamp(15px,1.6vw,20px);text-transform:uppercase;letter-spacing:.1em;padding-bottom:.55em}
.lp-por .lp-big{font-size:clamp(64px,9vw,128px);color:#FF7A2F}
.lp-por .lp-big sup{font-size:.36em;vertical-align:top;position:relative;top:.18em;margin-right:4px}
.lp-por .lp-big i{font-style:normal;font-size:.5em;color:#fff;cursor:pointer}
.s2 .lp-por .lp-big{color:#fff}.s2 .lp-por .lp-big i{color:#FFB37A}
.lp-incl{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lp-incl span{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.s3 .lp-incl span{background:rgba(11,26,58,.08);border-color:rgba(11,26,58,.22)}
.lp-incl svg{color:#FF7A2F}.s3 .lp-incl svg{color:#0B1A3A}
.lp-ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lp-ctas .lp-cta svg{color:#1FAF5A}.s3 .lp-ctas .lp-cta svg{color:#3FCB97}
.lp-coin .lp-val b{font-size:clamp(56px,7.4vw,104px)}
.lp-coin.blue{background:#fff;border-color:#16349A}
.lp-coin.navy{background:#0B1A3A;color:#fff;border-color:#fff}
.lp-coin.navy .lp-coin-sub{background:#FF7A2F;color:#0B1A3A}
.lp-x2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,46px);line-height:1}
.lp-duo{position:relative;width:min(100%,460px);aspect-ratio:1.1;display:grid;place-items:center}
.lp-duo .g{position:absolute;width:74%;filter:drop-shadow(0 30px 40px rgba(11,26,58,.35))}
.lp-duo .g1{transform:translate(-12%,-16%) rotate(-8deg);animation:lpG1 6s ease-in-out infinite}
.lp-duo .g2{transform:translate(12%,18%) rotate(6deg);animation:lpG2 6s ease-in-out infinite}
@keyframes lpG1{50%{transform:translate(-10%,-20%) rotate(-5deg)}}
@keyframes lpG2{50%{transform:translate(10%,22%) rotate(9deg)}}
.lp-duo .free{position:absolute;right:2%;top:6%;background:#0B1A3A;color:#fff;border-radius:50%;width:38%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(10deg);font-family:var(--display);font-weight:800;text-transform:uppercase;box-shadow:0 20px 40px -18px rgba(11,26,58,.8);border:6px solid #fff}
.lp-duo .free small{font-size:clamp(11px,1.2vw,14px);letter-spacing:.12em}
.lp-duo .free b{font-size:clamp(24px,3vw,40px);line-height:.9;color:#FF7A2F}

/* ---- faixa: agende seu exame ---- */
.lp-band{background:#FF7A2F;color:#0B1A3A;overflow:hidden;border-block:4px solid #0B1A3A;position:relative;z-index:2}
.lp-mq{display:flex;width:max-content;animation:lpMq 26s linear infinite}
.lp-mq span{display:flex;align-items:center;gap:22px;padding:14px 11px;font-family:var(--display);font-weight:800;font-stretch:118%;text-transform:uppercase;font-size:clamp(20px,2.6vw,30px);white-space:nowrap;letter-spacing:.01em}
.lp-mq span i{width:14px;height:14px;border-radius:50%;background:#0B1A3A;flex:none}
@keyframes lpMq{to{transform:translateX(-50%)}}
.lp-book .lp-h2.mega{font-size:clamp(46px,7.4vw,104px);line-height:.9;text-transform:uppercase;font-stretch:118%;letter-spacing:-.015em}
.lp-book .lp-h2.mega em{display:block}
.lp-free{display:inline-flex;align-items:center;gap:8px;background:#0B1A3A;color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;margin-top:18px}
.lp-free b{color:#FF7A2F}
.lp-tst{background:none;border:0;padding:0;margin-top:14px;display:inline-flex;gap:8px;align-items:center;color:#1D44B8;font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:15.5px}

/* ---- carrossel interno de fotos da loja ---- */
.lp-gal{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;border:6px solid #FF7A2F;background:#0B1A3A;box-shadow:0 40px 70px -40px rgba(0,0,0,.7)}
.lp-gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.1s ease,transform 6.5s ease-out}
.lp-gal img.on{opacity:1;transform:scale(1)}
.lp-gal img.out{opacity:0;transform:scale(.98)}
.lp-galbar{position:absolute;left:14px;right:14px;top:14px;display:flex;gap:6px;z-index:2}
.lp-galbar button{flex:1;height:22px;border:0;background:none;padding:9px 0;cursor:pointer}
.lp-galbar button i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.4);overflow:hidden}
.lp-galbar button i b{display:block;height:100%;width:0;background:#fff}
.lp-galbar button.done i b{width:100%}
.lp-galbar button.on i b{animation:lpBar 5s linear forwards}
.lp-gal.hold .lp-galbar button.on i b{animation-play-state:paused}
.lp-galcap{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(11,26,58,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-photo.gal figcaption{z-index:3}

/* ---- rodapé de uma loja só ---- */
.lp-foot .lp-finfo{grid-template-columns:repeat(2,minmax(0,1fr))}
.lp-fbar a{color:#C3CEE8;text-underline-offset:3px;font-size:13.5px}
.lp-fbar a:hover{color:#fff}
.lp-fsoc{display:flex;gap:10px;margin-top:20px}
.lp-fsoc a{width:46px;height:46px;border-radius:14px;border:1.5px solid #1E3263;color:#fff;display:grid;place-items:center;transition:background .2s,border-color .2s}
.lp-fsoc a:hover{background:#16306B;border-color:#2A417A}

/* ---------- galeria de fotos da loja (sai uma, entra outra) ---------- */
function lpGaleria(fig) {
  const imgs = $$('img', fig), bars = $$('.lp-galbar button', fig), cap = $('.lp-galcap', fig), N = imgs.length;
  let cur = -1;
  const show = k => {
    const prev = cur; cur = (k + N) % N;
    imgs.forEach((im, j) => { im.classList.toggle('out', j === prev && prev !== cur); im.classList.toggle('on', j === cur); });
    bars.forEach((b, j) => { b.classList.remove('on'); b.classList.toggle('done', j < cur); });
    void fig.offsetWidth; bars[cur].classList.add('on'); cap.textContent = LP.fotos[cur].cap;
  };
  fig.addEventListener('animationend', e => { if (e.animationName === 'lpBar') show(cur + 1); });
  bars.forEach((b, j) => b.onclick = () => show(j));
  fig.addEventListener('mouseenter', () => fig.classList.add('hold')); fig.addEventListener('mouseleave', () => fig.classList.remove('hold'));
  let x0 = null;
  fig.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  fig.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); });
  show(0);
}

/* ---------- autoagendamento da loja ---------- */
function lpBooking(S, box) {
  const sync = () => {
    const tn = $('#tkn', box), tt = $('#tkt', box); if (!tn) return;
    const okN = S.nome.trim().length >= 2, okT = onlyDigits(S.tel).length >= 10, ready = !!(S.data && S.hora && okN && okT);
    tn.textContent = S.nome.trim() || 'Seu nome'; tn.className = S.nome.trim() ? '' : 'nil';
    tt.textContent = S.tel || 'Seu telefone'; tt.className = S.tel ? '' : 'nil';
    $('#bkgo', box).disabled = !ready;
    $('#bks3', box).classList.toggle('ok', okN && okT); $('#bkn3', box).innerHTML = okN && okT ? ic('check') : '3';
    const falta = [!S.data && 'o dia', !S.hora && 'o horário', !okN && 'o nome', !okT && 'o telefone com DDD'].filter(Boolean);
    $('#bkmiss', box).textContent = ready ? 'Tudo pronto. É só confirmar.' : 'Falta ' + falta.join(', ').replace(/, ([^,]*)$/, ' e $1') + '.';
  };
  const done = () => {
    const a = S.done, x = parseD(a.data);
    const msg = `Olá! Acabei de agendar meu exame de vista pelo site da Óticas Paiva ${L.nome}: ${DOWL[x.getDay()]}, ${fdate(a.data)} às ${a.hora}. Nome: ${a.nome}. Telefone: ${a.tel}.`;
    box.innerHTML = `<div class="bk-done"><div class="bk-seal">${ic('check')}</div><span class="lp-kick">Horário escolhido</span><h3>Falta só um toque, ${esc(a.nome.split(' ')[0])}!</h3>
      <p>Envie a mensagem pronta para a loja ${L.nome} no WhatsApp. A equipe lança o seu horário na agenda e confirma com você.</p>
      <div class="bk-recibo"><div><span>Dia</span><b>${DOWL[x.getDay()]}, ${x.getDate()} de ${MESL[x.getMonth()].toLowerCase()}</b></div><div><span>Horário</span><b>${a.hora}</b></div><div><span>Loja</span><b>${L.nome}</b></div><div><span>Endereço</span><b>${esc(L.end)}</b></div></div>
      <p class="bk-leve">${ic('info')}Leve um documento com foto e, se usar, seus óculos atuais.</p>
      <div class="bk-acts"><a class="bk-wa" target="_blank" rel="noopener" href="${waLink(L.wa, msg)}">${ic('wa')}Enviar agendamento no WhatsApp</a><button type="button" class="bk-again" id="bknew">Agendar para outra pessoa</button></div></div>`;
    $('#bknew', box).onclick = () => { S.done = null; S.nome = ''; S.tel = ''; draw(); };
  };
  const confirm = () => {
    if (!S.data || !S.hora || S.nome.trim().length < 2 || onlyDigits(S.tel).length < 10) return;
    if (!slotsLivres(S.data).some(s => s.h === S.hora && s.livre)) { const h = S.hora; S.hora = ''; draw(); $('#bkerr', box).innerHTML = `<div class="bk-err">O horário das ${h} não está mais livre. Escolha outro, por favor.</div>`; return; }
    const a = { data: S.data, hora: S.hora, nome: titleCase(S.nome.trim()), tel: S.tel, criado: new Date().toISOString() };
    try { localStorage.setItem(AG_KEY, JSON.stringify([...agLocal(), a].slice(-30))); } catch (e) { }
    S.done = a; S.hora = ''; draw(); box.scrollIntoView({ behavior: lpReduce() ? 'auto' : 'smooth', block: 'start' });
  };
  const draw = () => {
    if (S.done) return done();
    const days = [];
    for (let i = 0; days.length < 14 && i < 45; i++) { const d = iso(addDays(TODAY, i)); if (slotsLivres(d).some(s => s.livre)) days.push(d); }
    if (!S.data || !days.includes(S.data)) { S.data = days[0] || ''; S.hora = ''; }
    const sl = S.data ? slotsLivres(S.data) : [];
    if (S.hora && !sl.some(s => s.h === S.hora && s.livre)) S.hora = '';
    const dt = S.data ? parseD(S.data) : null, amanha = iso(addDays(TODAY, 1));
    const per = [['Manhã', h => +h.slice(0, 2) < 12], ['Tarde', h => +h.slice(0, 2) >= 12 && +h.slice(0, 2) < 18], ['Noite', h => +h.slice(0, 2) >= 18]].map(([t, f]) => [t, sl.filter(s => f(s.h))]).filter(p => p[1].length);
    const keepScroll = $('.bk-days', box)?.scrollLeft || 0, lock = S.hora ? '' : 'tabindex="-1"';
    box.innerHTML = `<div class="bk"><div class="bk-panel">
      <div class="bk-step ${S.data ? 'ok' : ''}"><div class="bk-sh"><span class="n">${S.data ? ic('check') : '1'}</span><h3>Escolha o dia</h3><small>Loja ${L.nome} · segunda a sábado</small></div>
        ${days.length ? `<div class="bk-days" role="group" aria-label="Dias disponíveis">${days.map(d => { const x = parseD(d); return `<button type="button" class="bk-day" data-d="${d}" aria-pressed="${S.data === d}"><small>${d === todayISO ? 'Hoje' : d === amanha ? 'Amanhã' : DOW[x.getDay()]}</small><b>${x.getDate()}</b><span>${MES[x.getMonth()]}</span></button>`; }).join('')}</div>` : `<div class="bk-empty">Nenhum horário livre nos próximos dias. Chame a loja no WhatsApp ${L.wa}.</div>`}</div>
      <div class="bk-step ${S.data ? '' : 'locked'} ${S.hora ? 'ok' : ''}"><div class="bk-sh"><span class="n">${S.hora ? ic('check') : '2'}</span><h3>Escolha o horário</h3><small>${dt ? `${DOWL[dt.getDay()]}, ${dt.getDate()} de ${MESL[dt.getMonth()].toLowerCase()}` : ''}</small></div>
        ${per.map(([t, a]) => `<div class="bk-per">${t}</div><div class="bk-times">${a.map(s => `<button type="button" class="bk-time" data-h="${s.h}" aria-pressed="${S.hora === s.h}" ${s.livre ? '' : `disabled aria-label="${s.h}, indisponível"`}>${s.h}</button>`).join('')}</div>`).join('') || '<div class="bk-empty">Escolha um dia para ver os horários.</div>'}</div>
      <div class="bk-step ${S.hora ? '' : 'locked'}" id="bks3"><div class="bk-sh"><span class="n" id="bkn3">3</span><h3>Seus dados</h3><small>Só para confirmar o exame</small></div>
        <div class="bk-fields"><div class="bk-f"><label for="bknm">Nome</label><input id="bknm" autocomplete="name" placeholder="Seu nome" value="${esc(S.nome)}" ${lock}></div><div class="bk-f"><label for="bktel">Telefone (WhatsApp)</label><input id="bktel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(21) 99999-9999" value="${esc(S.tel)}" ${lock}></div></div></div>
    </div>
    <aside class="bk-ticket" aria-label="Resumo do agendamento"><span class="k">Seu agendamento</span><h4>Exame de vista</h4>
      <dl><div><dt>Loja</dt><dd>${L.nome}</dd></div><div><dt>Dia</dt><dd class="${dt ? '' : 'nil'}">${dt ? `${DOWL[dt.getDay()]}, ${fdate(S.data)}` : 'Escolha o dia'}</dd></div><div><dt>Horário</dt><dd class="${S.hora ? '' : 'nil'}">${S.hora || 'Escolha o horário'}</dd></div><div><dt>Nome</dt><dd id="tkn"></dd></div><div><dt>Telefone</dt><dd id="tkt"></dd></div></dl>
      
      <button type="button" class="bk-go" id="bkgo">${ic('check')}Confirmar agendamento</button><p class="bk-miss" id="bkmiss"></p><div id="bkerr" role="alert"></div>
      <p class="bk-msg">${ic('pin')}<span>Óticas Paiva ${L.nome}<br>${esc(L.end)}</span></p></aside></div>`;
    const strip = $('.bk-days', box); if (strip) strip.scrollLeft = keepScroll;
    $$('[data-d]', box).forEach(b => b.onclick = () => { S.data = b.dataset.d; S.hora = ''; draw(); });
    $$('[data-h]', box).forEach(b => b.onclick = () => { S.hora = b.dataset.h; draw(); if (innerWidth < 980) $('#bks3', box).scrollIntoView({ behavior: lpReduce() ? 'auto' : 'smooth', block: 'center' }); if (!S.nome.trim()) $('#bknm', box).focus({ preventScroll: true }); });
    const nm = $('#bknm', box), tel = $('#bktel', box);
    nm.oninput = () => { S.nome = nm.value; sync(); };
    tel.oninput = () => { tel.value = maskTel(tel.value); S.tel = tel.value; sync(); };
    $('#bkgo', box).onclick = confirm;
    sync();
  };
  draw();
}

  </div></section>

  <footer class="lp-foot"><div class="lp-in">
    <div class="lp-fbrand"><div class="brand"><span>Óticas</span><b>Paiva</b></div><p>Nosso atendimento, seu maior valor.</p>
      <div class="lp-fsoc"><a href="${waLink(L.wa, `Olá! Vim pelo site da Óticas Paiva ${L.nome}.`)}" target="_blank" rel="noopener" aria-label="WhatsApp da loja ${L.nome}">${ic('wa')}</a><a href="https://instagram.com/${L.ig.replace('@', '')}" target="_blank" rel="noopener" aria-label="Instagram ${L.ig}">${ic('insta')}</a><a href="${lpMapa()}" target="_blank" rel="noopener" aria-label="Ver a loja no mapa">${ic('pin')}</a></div></div>
    <div class="lp-finfo"><b class="lp-fname" style="grid-column:1/-1">Loja ${L.nome}</b>
      <a href="${lpMapa()}" target="_blank" rel="noopener">${ic('pin')}<span>${esc(L.end)}<br>${esc(L.bairro.replace(' — RJ', ''))}</span></a><div>${ic('clock')}<span>${L.horLongo}</span></div>
      <a href="${waLink(L.wa, `Olá! Vim pelo site da Óticas Paiva ${L.nome}.`)}" target="_blank" rel="noopener">${ic('wa')}<span>WhatsApp ${L.wa}</span></a><a href="https://instagram.com/${L.ig.replace('@', '')}" target="_blank" rel="noopener">${ic('insta')}<span>Instagram ${L.ig}</span></a></div>
    <div class="lp-fbar"><span>© 2026 Óticas Paiva · Loja ${L.nome}</span></div>
  </div></footer>
  </div>
  <button type="button" class="lp-gift" id="lpgift">${'<span class="gi">' + ic('gift') + '</span>'}Garanta seu brinde</button>`;
  const toBook = () => $('#lpagendar').scrollIntoView({ behavior: lpReduce() ? 'auto' : 'smooth', block: 'start' });
  $$('[data-goto]').forEach(b => b.onclick = toBook);
  $$('[data-teste]').forEach(b => b.onclick = () => lpTeste(toBook));
  $$('[data-reg]').forEach(b => b.onclick = e => { e.stopPropagation(); regulamento(+b.dataset.reg); });
  $('#lpgift').onclick = brinde;
  lpCarousel($('#lpcar'));
  $$('[data-cd]').forEach(cd => { const start = new Date(cd.dataset.cd).getTime(), fim = new Date(cd.dataset.end || cd.dataset.cd).getTime(), b = $$('b', cd), card = cd.closest('.bf-card'), k = $('.bf-k', card);
    const tick = () => { const now = Date.now(), on = now >= start, end = on ? fim : start; let t = Math.max(0, end - now) / 1000; const v = [Math.floor(t / 86400), Math.floor(t % 86400 / 3600), Math.floor(t % 3600 / 60), Math.floor(t % 60)]; b.forEach((x, j) => x.textContent = pad(v[j])); card.classList.toggle('live', on && now < fim); k.textContent = !on ? 'Começa em' : now < fim ? 'Termina em' : 'Encerrada'; };
    tick(); setInterval(tick, 1000); });
  lpBooking({ data: '', hora: '', nome: '', tel: '', done: null }, $('#lpbk'));
  lpReviews(toBook);
  const gift = $('#lpgift'), sec = $('#lpagendar');
  if (window.IntersectionObserver) new IntersectionObserver(es => es.forEach(e => gift.classList.toggle('hide', e.isIntersecting && e.intersectionRatio > .35)), { threshold: [0, .35, .6] }).observe($('#lpbk'));
}
render();
</script>
